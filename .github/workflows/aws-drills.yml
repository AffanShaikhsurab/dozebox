# Real-AWS drills in the project's test account. Manual only, behind the approved `aws-test` environment.
# While GitHub Actions is unavailable, the same scripts run from a build box with the operator's profile.
name: aws-drills
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Exit script under scripts/aws-exit/ (for example phase1.sh)"
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-drills
  cancel-in-progress: false
jobs:
  drill:
    runs-on: ubuntu-24.04
    environment: aws-test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.x"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TEST_ROLE_ARN }}
          aws-region: us-east-1
      - run: pnpm install --frozen-lockfile
      - name: Run the exit script
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          case "$SCRIPT" in
            *[!A-Za-z0-9._-]*) echo "bad script name"; exit 1 ;;
          esac
          bash "scripts/aws-exit/$SCRIPT"
