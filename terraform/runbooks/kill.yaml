description: |
  Kill switch (part 8 §8.2). Attaches the deny policy to the box and control roles, records the freeze, sets the
  box's groups to 0 and stops its running instances. Started by the kill switch rule when an alarm fires, or by the
  control function on a budget freeze. Only the unfreeze runbook undoes it.
schemaVersion: "0.3"
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  AutomationAssumeRole:
    type: String
    description: The kill role.
  BoxId:
    type: String
    allowedPattern: "^[a-z0-9][a-z0-9-]{0,19}$"
  TagKey:
    type: String
    description: The box tag key, <prefix>:box.
  BoxRoleName:
    type: String
  ControlRoleName:
    type: String
  DenyPolicyArn:
    type: String
  FreezeParameter:
    type: String
    description: The SSM parameter that records the freeze.
  GroupNames:
    type: StringList
    default: []
    description: The box's Auto Scaling groups; empty when the stack has none.
  Reason:
    type: String
    default: kill
    description: The alarm name, or why the freeze was started.
mainSteps:
  - name: DenyTheBoxRole
    action: aws:executeAwsApi
    inputs:
      Service: iam
      Api: AttachRolePolicy
      RoleName: "{{ BoxRoleName }}"
      PolicyArn: "{{ DenyPolicyArn }}"
  - name: DenyTheControlRole
    action: aws:executeAwsApi
    inputs:
      Service: iam
      Api: AttachRolePolicy
      RoleName: "{{ ControlRoleName }}"
      PolicyArn: "{{ DenyPolicyArn }}"
  - name: RecordTheFreeze
    action: aws:executeAwsApi
    inputs:
      Service: ssm
      Api: PutParameter
      Name: "{{ FreezeParameter }}"
      Type: String
      Overwrite: true
      Value: '{"v":1,"frozen":true,"by":"kill","reason":"{{ Reason }}","at":"{{ global:DATE_TIME }}"}'
  - name: ZeroGroupsAndStopInstances
    action: aws:executeScript
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        BoxId: "{{ BoxId }}"
        TagKey: "{{ TagKey }}"
        GroupNames: "{{ GroupNames }}"
      Script: |
        import boto3


        def handler(events, context):
            ec2 = boto3.client("ec2")
            groups = boto3.client("autoscaling")
            # Groups first, so a group does not replace an instance this step stops.
            for name in events["GroupNames"]:
                groups.set_desired_capacity(AutoScalingGroupName=name, DesiredCapacity=0, HonorCooldown=False)
            ids = []
            filters = [
                {"Name": "tag:" + events["TagKey"], "Values": [events["BoxId"]]},
                {"Name": "instance-state-name", "Values": ["pending", "running"]},
            ]
            for page in ec2.get_paginator("describe_instances").paginate(Filters=filters):
                for reservation in page["Reservations"]:
                    ids.extend(i["InstanceId"] for i in reservation["Instances"])
            stopped = []
            for instance_id in ids:
                try:
                    ec2.stop_instances(InstanceIds=[instance_id])
                    stopped.append(instance_id)
                except ec2.exceptions.ClientError as e:
                    # A group instance the zeroed group is already terminating.
                    if e.response["Error"]["Code"] != "IncorrectInstanceState":
                        raise
            return {"stopped": stopped, "zeroed": events["GroupNames"]}
    outputs:
      - Name: Stopped
        Selector: $.Payload.stopped
        Type: StringList
