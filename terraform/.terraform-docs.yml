formatter: markdown table
version: ">= 0.20.0, < 1.0.0"
output:
  file: ../docs/configuration.md
  mode: inject
sections:
  show:
    - inputs
    - outputs
settings:
  anchor: false
  default: true
  escape: true
  hide-empty: false
  html: false
  indent: 3
  lockfile: false
  required: true
  sensitive: true
  type: true
sort:
  enabled: false
